name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate AI answers with repository secret
        env:
          POTENS_API_KEY: ${{ secrets.POTENS_API_KEY }}
          POTENS_MODEL: ${{ secrets.POTENS_MODEL }}
        run: node scripts/generate-ai-responses.mjs
      - name: Build static routes
        env:
          NEXT_PUBLIC_BASE_PATH: /my
        run: npx vinext build --prerender-all
      - name: Assemble Pages artifact
        run: |
          mkdir -p _site/ai-guide
          cp -R dist/client/. _site/
          cp dist/server/prerendered-routes/index.html _site/index.html
          cp dist/server/prerendered-routes/ai-guide.html _site/ai-guide/index.html
          cp dist/server/prerendered-routes/404.html _site/404.html
          find _site -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 | xargs -0 sed -i \
            -e 's|"/_next/|"/my/_next/|g' \
            -e "s|'/\\_next/|'/my/_next/|g" \
            -e 's|url(/_next/|url(/my/_next/|g'
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
